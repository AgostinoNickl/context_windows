<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy Text</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 64px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #111;
      background: #fff;
    }

    .copy-link {
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <p id="text-to-copy">Replace this sentence with the exact plain text you want visitors to copy and paste.</p>

  <button class="copy-link" onclick="copyText()">Click here to copy the text</button>

  <p id="status" class="status" aria-live="polite"></p>

  <script>
    async function copyText() {
      const text = document.getElementById("text-to-copy").innerText;
      const status = document.getElementById("status");

      try {
        await navigator.clipboard.writeText(text);
        status.innerText = "Copied.";
      } catch (error) {
        status.innerText = "Copy failed. Please select the text manually.";
      }
    }
  </script>

</body>
</html>
